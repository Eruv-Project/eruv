[project]
name = "eruv-server"
version = "0.1.0"
description = "Eruv fiber monitoring server: device ingest, status engine, app API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn serves /ws only with a WebSocket implementation installed.
    "websockets>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    # Expo push sender (app/push.py).
    "httpx>=0.27",
    # UploadFile for the admin pole-file preview (app/api/admin.py).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
