[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eruv-agent"
version = "1.0.0"
description = "Raspberry Pi agent that drives the OTDR module and reports to the Eruv monitoring server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.18",
]

[project.scripts]
eruv-agent = "eruv_agent.__main__:main"

[tool.setuptools]
packages = ["eruv_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
