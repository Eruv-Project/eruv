<!doctype html>
<!--
  Eruv ring map (R15, R17; KTD4). Loaded by src/components/EruvMap.tsx inside
  react-native-webview. After editing, run `npm run build:map` to regenerate
  src/components/mapHtml.generated.ts (a test fails while they differ).

  Leaflet 1.9.4 comes from unpkg with Subresource Integrity; the base map needs the
  network for OpenStreetMap tiles anyway. The WebView loads this page under the API
  origin, so tile requests carry a Referer, and adds an app name to the User-Agent
  (OpenStreetMap tile usage policy).

  Bridge: the app calls window.eruvReceive(message) (also accepted as a
  window/document "message" event). Message:
    { "type": "render", "poles": [{number, lat, lon}], "view": "break" | "ring",
      "breakPoint": null | { "lat", "lon", "poles": [bounding pole numbers] } }
  Also { "type": "me", "me": null | { "lat", "lon", "accuracy" } } (the phone's
  position, a blue dot) and { "type": "center-me" } (centre the map on it).
  The page posts {"type": "ready"} to the app when it can receive.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      /* Palette from the app icon (src/components/ui.tsx). */
      html, body, #map { height: 100%; margin: 0; padding: 0; background: #0C182A; }
      /* Night rendering of the standard OpenStreetMap tiles (same tiles, restyled). */
      .leaflet-tile-pane {
        filter: invert(1) hue-rotate(200deg) brightness(0.78) contrast(0.92) saturate(0.45);
      }
      .leaflet-container { background: #0C182A; font: 13px/1.3 -apple-system, Roboto, sans-serif; }
      .leaflet-bar { border: 1px solid #2A4064 !important; border-radius: 10px !important; overflow: hidden; }
      .leaflet-bar a, .leaflet-bar a:hover {
        background: #13243C; color: #EDF3FA; border-bottom-color: #2A4064; width: 34px; height: 34px; line-height: 34px;
      }
      .leaflet-control-attribution { background: rgba(12, 24, 42, 0.75) !important; color: #93A6BF; }
      .leaflet-control-attribution a { color: #3FD8FF; }
      .pole-label {
        font: 700 11px/1 -apple-system, Roboto, sans-serif;
        color: #E6B850;
        background: rgba(12, 24, 42, 0.88);
        border: 1px solid rgba(230, 184, 80, 0.45);
        border-radius: 6px;
        padding: 3px 5px;
        white-space: nowrap;
      }
      .pole-label.strong { color: #fff; background: #FF5D5D; border-color: #fff; font-size: 13px; }
      .break-mark { background: none; border: none; }
      .break-mark .pulse {
        position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid #FF5D5D; box-sizing: border-box; animation: pulse 1.8s ease-out infinite;
      }
      .break-mark .core {
        position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; border-radius: 50%;
        background: #FF5D5D; border: 3px solid #fff; box-sizing: border-box;
      }
      .me-dot {
        width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box;
        background: #4C8DFF; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(76, 141, 255, 0.35);
      }
      @keyframes pulse { from { transform: scale(0.45); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .break-mark .pulse { animation: none; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      (function () {
        var LABEL_MIN_PX = 24; // two labels closer than this would overlap
        var BREAK_ZOOM = 17;
        var FIBER = '#3FD8FF';
        var GOLD = '#E6B850';
        var NIGHT = '#0C182A';
        var RED = '#FF5D5D';

        function post(message) {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
        }

        var map = L.map('map', { zoomControl: true });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        map.setView([31.5, 34.9], 8);

        var shapes = L.layerGroup().addTo(map);
        var labels = L.layerGroup().addTo(map);
        var current = null;

        function highlighted(number) {
          return !!(current && current.breakPoint && current.breakPoint.poles.indexOf(number) >= 0);
        }

        function label(pole, strong) {
          return L.marker([pole.lat, pole.lon], {
            interactive: false,
            keyboard: false,
            icon: L.divIcon({
              className: 'pole-label' + (strong ? ' strong' : ''),
              html: String(pole.number),
              iconSize: null,
              iconAnchor: [-6, 20],
            }),
          });
        }

        // Label as many poles as fit without overlapping at this zoom. The
        // bounding poles of a break are always labelled.
        function relabel() {
          labels.clearLayers();
          if (!current) return;
          var placed = [];
          var poles = current.poles;
          var ordered = poles.filter(function (p) { return highlighted(p.number); })
            .concat(poles.filter(function (p) { return !highlighted(p.number); }));
          ordered.forEach(function (pole) {
            var strong = highlighted(pole.number);
            var point = map.latLngToLayerPoint([pole.lat, pole.lon]);
            if (!strong) {
              for (var i = 0; i < placed.length; i++) {
                if (placed[i].distanceTo(point) < LABEL_MIN_PX) return;
              }
            }
            placed.push(point);
            label(pole, strong).addTo(labels);
          });
        }

        function fit() {
          var bp = current.breakPoint;
          var points = current.poles.map(function (p) { return [p.lat, p.lon]; });
          if (bp && current.view === 'break') map.setView([bp.lat, bp.lon], BREAK_ZOOM);
          else if (points.length) map.fitBounds(L.latLngBounds(points), { padding: [24, 24] });
        }

        function render(message) {
          current = message;
          shapes.clearLayers();
          var bp = message.breakPoint;
          var points = message.poles.map(function (p) { return [p.lat, p.lon]; });
          if (points.length >= 2) {
            // Closed ring in pole-number order (the server sends poles ordered).
            // The lit fiber: a soft glow under a bright line, as in the app icon.
            L.polygon(points, { color: FIBER, weight: 12, opacity: 0.18, fill: false, interactive: false }).addTo(shapes);
            L.polygon(points, { color: FIBER, weight: 3, fillColor: FIBER, fillOpacity: 0.06, interactive: false }).addTo(shapes);
          }
          if (bp && bp.poles.length === 2) {
            var ends = message.poles.filter(function (p) { return highlighted(p.number); });
            if (ends.length === 2) {
              var span = ends.map(function (p) { return [p.lat, p.lon]; });
              L.polyline(span, { color: RED, weight: 14, opacity: 0.3, interactive: false }).addTo(shapes);
              L.polyline(span, { color: RED, weight: 5, interactive: false }).addTo(shapes);
            }
          }
          message.poles.forEach(function (pole) {
            var hot = highlighted(pole.number);
            L.circleMarker([pole.lat, pole.lon], {
              radius: hot ? 8 : 4.5,
              color: hot ? '#ffffff' : NIGHT,
              weight: 2,
              fillColor: hot ? RED : GOLD,
              fillOpacity: 1,
              interactive: false,
            }).addTo(shapes);
          });
          if (bp) {
            L.marker([bp.lat, bp.lon], {
              interactive: false,
              keyboard: false,
              zIndexOffset: 1000,
              icon: L.divIcon({
                className: 'break-mark',
                iconSize: [44, 44],
                iconAnchor: [22, 22],
                html: '<div class="pulse"></div><div class="core"></div>',
              }),
            }).addTo(shapes);
          }
          fit();
          relabel();
        }

        // The phone's own position: a blue dot over the ring, with its accuracy circle.
        var meLayer = L.layerGroup().addTo(map);
        var me = null;
        function showMe(position) {
          me = position;
          meLayer.clearLayers();
          if (!me) return;
          if (me.accuracy) {
            L.circle([me.lat, me.lon], {
              radius: me.accuracy, color: '#4C8DFF', weight: 1, opacity: 0.6,
              fillColor: '#4C8DFF', fillOpacity: 0.12, interactive: false,
            }).addTo(meLayer);
          }
          L.marker([me.lat, me.lon], {
            interactive: false, keyboard: false, zIndexOffset: 2000,
            icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
          }).addTo(meLayer);
        }

        map.on('zoomend', relabel);

        window.eruvReceive = function (message) {
          if (typeof message === 'string') message = JSON.parse(message);
          if (!message) return;
          if (message.type === 'render') render(message);
          else if (message.type === 'me') showMe(message.me);
          else if (message.type === 'center-me' && me) map.setView([me.lat, me.lon], Math.max(map.getZoom(), 17));
        };
        function onMessage(event) {
          try {
            window.eruvReceive(event.data);
          } catch (e) {}
        }
        window.addEventListener('message', onMessage);
        document.addEventListener('message', onMessage);

        post({ type: 'ready' });
      })();
    </script>
  </body>
</html>
